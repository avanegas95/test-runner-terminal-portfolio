name: CI

on:
  push:
    branches: [main, feat/**]
  pull_request:
    branches: [main]
  schedule:
    # Nightly full browser matrix (nod to nightly HIL runs)
    - cron: "0 6 * * *"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-and-build:
    name: Lint, typecheck, vitest, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Vitest
        run: npx vitest run

      - name: Build
        run: npm run build

  e2e:
    name: Playwright e2e (chromium)
    runs-on: ubuntu-latest
    needs: unit-and-build
    if: github.event_name != 'schedule'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: e2e/requirements-dev.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build

      - name: Install Python e2e dependencies
        run: pip install -r e2e/requirements-dev.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Start production server
        run: npm start &
        env:
          PORT: 3000

      - name: Wait for server
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run e2e tests
        working-directory: e2e
        run: >
          pytest
          -m "smoke or sanity or regression"
          --browser chromium
          --tracing retain-on-failure
          --html=report.html
          --self-contained-html
        env:
          BASE_URL: http://localhost:3000

      - name: Upload pytest HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-html-report
          path: e2e/report.html
          if-no-files-found: ignore

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: e2e/test-results/
          if-no-files-found: ignore

  e2e-nightly:
    name: Nightly e2e (${{ matrix.browser }})
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: e2e/requirements-dev.txt

      - name: Install Node dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build

      - name: Install Python e2e dependencies
        run: pip install -r e2e/requirements-dev.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps ${{ matrix.browser }}

      - name: Start production server
        run: npm start &
        env:
          PORT: 3000

      - name: Wait for server
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run full e2e suite
        working-directory: e2e
        run: >
          pytest
          --browser ${{ matrix.browser }}
          --tracing retain-on-failure
          --html=report-${{ matrix.browser }}.html
          --self-contained-html
        env:
          BASE_URL: http://localhost:3000

      - name: Upload pytest HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-html-report-${{ matrix.browser }}
          path: e2e/report-${{ matrix.browser }}.html
          if-no-files-found: ignore

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.browser }}
          path: e2e/test-results/
          if-no-files-found: ignore
